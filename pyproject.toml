[project]
name = "airflow-versioning-demo"
version = "0.1.0"
description = "A local Apache Airflow 3 DAG bundle versioning demonstration."
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-airflow==3.3.1",
    "apache-airflow-providers-git",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["logs"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
